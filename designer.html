        <style>
          /* ========================================================
             SIMPLE VERTICAL BUTTONS WITH ICON & TEXT
             ======================================================== */

          /* الحاوية الرئيسية للأزرار (تحت بعضها) */
          .example-2 {
            display: flex;
            flex-direction: column; /* جعل الأزرار رأسية */
            gap: 12px;
            list-style: none;
            padding: 0;
            margin: 20px 0;
            width: 100%;
            max-width: 320px;
          }

          .example-2 .icon-content {
            width: 100%;
          }

          /* تصميم الزر العريض يحتوي على الأيقونة والنص بجانبها */
          .example-2 .icon-content a {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            width: 100%;
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-decoration: none;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.25s ease;
          }

          .example-2 .icon-content a .filled {
            display: none; 
          }

          /* حجم الأيقونة داخل الزر */
          .example-2 .icon-content a svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            transition: transform 0.25s ease;
          }

          /* تأثير التأشير (Hover) */
          .example-2 .icon-content a:hover {
            transform: translateX(4px); /* إزاحة بسيطة لليمين */
            background: rgba(255, 255, 255, 0.08);
          }

          .example-2 .icon-content a:hover svg {
            transform: scale(1.1);
          }

          /* ألوان التأشير حسب المنصة */
          .example-2 .icon-content a[data-social="whatsapp"]:hover {
            border-color: rgba(37, 211, 102, 0.5);
            color: #25D366;
          }

          .example-2 .icon-content a[data-social="facebook"]:hover {
            border-color: rgba(24, 119, 242, 0.5);
            color: #1877F2;
          }

          .example-2 .icon-content a[data-social="github"]:hover {
            border-color: rgba(255, 255, 255, 0.5);
            color: #ffffff;
          }

          /* إلغاء الـ Tooltip الأخير لأنه أصلًا أصبح مكتوباً داخل الزر */
          .example-2 .icon-content .tooltip {
            display: none;
          }
        </style>

            const sidebarSide = localStorage.getItem('settings-sidebarSide') || 'right';
            const animations = localStorage.getItem('settings-animations') || 'normal';
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.setAttribute('data-accent', accent);
            document.documentElement.setAttribute('data-font-size', fontSize);
            document.documentElement.setAttribute('data-sidebar-side', sidebarSide);
            document.documentElement.setAttribute('data-animations', animations);
          })();

    <script>
      const menuBtn = document.getElementById('menuBtn');
      const sideMenu = document.getElementById('sideMenu');
      const overlay = document.getElementById('menuOverlay');
      const closeMenu = document.getElementById('closeMenu');

      function openMenu() {
        sideMenu.classList.add('open');
        overlay.classList.add('show');
        document.body.style.overflow = 'hidden';
      }

      function closeMenuPanel() {
        sideMenu.classList.remove('open');
        overlay.classList.remove('show');
        document.body.style.overflow = '';
      }

      menuBtn.addEventListener('click', openMenu);
      closeMenu.addEventListener('click', closeMenuPanel);
      overlay.addEventListener('click', closeMenuPanel);

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          closeMenuPanel();
        }
      });
    </script>
