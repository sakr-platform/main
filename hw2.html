<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMR SAKR | Student Homework</title>
  <link rel="stylesheet" href="style.css?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech&display=swap" rel="stylesheet">
  <link rel="icon" href="logo.png" type="image/png">

  <style>
    body {
      padding-top: 82px;
    }

    .hero-wrap {
      width: min(100%, 1120px);
      margin: 0 auto;
    }

    .student-box {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .error-card {
      background: rgba(255, 77, 77, 0.1);
      border: 1px solid rgba(255, 77, 77, 0.25);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      color: #ff8d8d;
    }

    .hw-card {
      background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      position: relative;
      text-align: left;
    }

    .hw-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
      padding-bottom: 10px;
    }

    .hw-title {
      margin: 0;
      font-size: 20px;
      color: #ffd700;
      letter-spacing: 0.5px;
    }

    .hw-tag {
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      background: rgba(0, 176, 255, 0.2);
      color: #00b0ff;
      border: 1px solid rgba(0, 176, 255, 0.4);
    }

    .lesson-text {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.9);
      font-weight: bold;
    }

    .hw-content-text {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.8);
      white-space: pre-wrap;
      line-height: 1.6;
    }

    /* تنسيق النقطة باللون الذهبي */
    .bullet-styled {
      color: #ffd700;
      font-weight: bold;
    }

    @media (max-width: 768px) {
    
      .hw-header {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>

  <script>
    (function() {
      const theme = localStorage.getItem('settings-theme') || 'dark';
      const accent = localStorage.getItem('settings-accent') || 'gold';
      const fontSize = localStorage.getItem('settings-fontSize') || 'normal';
      const sidebarSide = localStorage.getItem('settings-sidebarSide') || 'right';
      const animations = localStorage.getItem('settings-animations') || 'normal';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-accent', accent);
      document.documentElement.setAttribute('data-font-size', fontSize);
      document.documentElement.setAttribute('data-sidebar-side', sidebarSide);
      document.documentElement.setAttribute('data-animations', animations);
    })();
  </script>
  <script src="settings.js" defer></script>
</head>
<body>

  <div id="menuOverlay" class="menu-overlay"></div>

  <div class="upbox">
    &nbsp;&nbsp;&nbsp;&nbsp;<div class="hh"> <img src="logo.png" width="70px" alt="Logo"></div>
    <span class="brand-name">AMR SAKR</span>
    <div class="upboxs">
      <button id="menuBtn" class="menu-btn" type="button" aria-label="Open menu">
        <img src="menu.png" width="60px" alt="Menu">
      </button>
    </div>
  </div>

  <aside id="sideMenu" class="side-menu" aria-label="Main menu">
    <button id="closeMenu" class="close-menu" type="button" aria-label="Close menu">×</button>
    <h2>AMR SAKR</h2>
    <a href="code.html">SIGN IN</a>
    <a href="contact.html">CONTACT</a>
    <a href="designer.html">THE WEB DESIGNER</a>
  </aside>

  <main class="hero-wrap">
    <section class="hero-card hero-split">
      <article class="hero-visual">
        <p class="eyebrow">unlock the wonders of science</p>
        <img src="logo.png" width="300px" id="mlogo" alt="AMR SAKR logo">
        <h1 class="hero-title">Your Assignments</h1>
        <p class="hero-text">Your homework is loaded</p>
        <br><br>
      </article>

      <aside class="hero-actions">
        <div class="btn-group" style="width: 100%;">
          <button id="refreshBtn" class="btn" style="width: 100%; margin-bottom: 10px;">REFRESH HOMEWORK</button>          
          <div id="resultBox" class="student-box"></div>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const menuBtn = document.getElementById('menuBtn');
    const sideMenu = document.getElementById('sideMenu');
    const overlay = document.getElementById('menuOverlay');
    const closeMenu = document.getElementById('closeMenu');

    function openMenu() {
      sideMenu.classList.add('open');
      overlay.classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeMenuPanel() {
      sideMenu.classList.remove('open');
      overlay.classList.remove('show');
      document.body.style.overflow = '';
    }

    menuBtn.addEventListener('click', openMenu);
    closeMenu.addEventListener('click', closeMenuPanel);
    overlay.addEventListener('click', closeMenuPanel);

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') closeMenuPanel();
    });
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, doc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCEFLxdWt8h1_JWjzyJ2n2dP-HXxmD3jvU",
      authDomain: "signup-27311.firebaseapp.com",
      projectId: "signup-27311",
      storageBucket: "signup-27311.firebasestorage.app",
      messagingSenderId: "486600508939",
      appId: "1:486600508939:web:6802cff99cb9244218a90e"
    };

    const studentFirebaseConfig = {
      apiKey: "AIzaSyCEFLxdWt8h1_JWjzyJ2n2dP-HXxmD3jvU",
      authDomain: "students-68430.firebaseapp.com",
      projectId: "students-68430",
      storageBucket: "students-68430.firebasestorage.app",
      messagingSenderId: "202641775624",
      appId: "1:202641775624:web:fe2d70e4ec92d62d5b85bd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const studentsApp = initializeApp(studentFirebaseConfig, "students-shared");
    const dbStudents = getFirestore(studentsApp);
    const currentGrade = "2";
    const resultBox = document.getElementById("resultBox");

    async function getCurrentStudentGroup() {
      const userId = localStorage.getItem("userId") || localStorage.getItem("savedCode");
      if (!userId) return "";
      try {
        const snap = await getDoc(doc(dbStudents, "students", userId));
        if (!snap.exists()) return "";
        return (snap.data().group || "").toString();
      } catch (error) {
        console.error("Error loading student group:", error);
        return "";
      }
    }

    async function loadHomeworks() {
      try {
        const snapshot = await getDocs(collection(db, "homeworks"));
        const studentGroup = await getCurrentStudentGroup();
        const homeworks = snapshot.docs
          .map(doc => ({ id: doc.id, ...doc.data() }))
          .filter((item) => {
            const sameGrade = String(item.grade || "") === String(currentGrade);
            if (!studentGroup) return sameGrade && (!item.group || item.group === "");
            if (item.group && item.group !== "") return item.group === studentGroup && sameGrade;
            return sameGrade;
          })
          .sort((a, b) => Number(b.hwNumber || 0) - Number(a.hwNumber || 0));

        resultBox.innerHTML = "";

        if (!homeworks.length) {
          resultBox.innerHTML = "<div class='error-card' style='background:rgba(255,255,255,0.05); color:#fff; border-color:rgba(255,255,255,0.1)'><strong>No homework uploaded yet.</strong></div>";
          return;
        }

        homeworks.forEach((item) => {
          const card = document.createElement("div");
          card.className = "hw-card";

          // استبدال كلاً من النقطة الثقيلة (●) والنقطة العادية (•) بتغليفها بالـ span الذهبي
          const formattedContent = (item.content || "").replace(/[●•]/g, (match) => `<span class="bullet-styled">${match}</span>`);

          card.innerHTML = `
            <div class="hw-header">
              <h4 class="hw-title">Homework #${item.hwNumber || '-'}</h4>
            </div>
            <div class="lesson-text">Lesson: ${item.lessonTitle || '-'}</div>
            <div class="hw-content-text">${formattedContent}</div>
          `;
          
          resultBox.appendChild(card);
        });

      } catch (err) {
        console.error("Error loading homeworks:", err);
        resultBox.innerHTML = "<div class='error-card'><strong>An error occurred while loading homework.</strong></div>";
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", loadHomeworks);
    loadHomeworks();
  </script>
</body>
</html>
