  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCS4KHbegH4qOWwE0rZmOboW7Cd4FgIW04",
  authDomain: "course2-781a7.firebaseapp.com",
  projectId: "course2-781a7",
  storageBucket: "course2-781a7.firebasestorage.app",
  messagingSenderId: "1012690578717",
  appId: "1:1012690578717:web:9592763fcf801d0d6b45f4"
};

const studentFirebaseConfig = {
  apiKey: "AIzaSyCEFLxdWt8h1_JWjzyJ2n2dP-HXxmD3jvU",
  authDomain: "students-68430.firebaseapp.com",
  projectId: "students-68430",
  storageBucket: "students-68430.firebasestorage.app",
  messagingSenderId: "202641775624",
  appId: "1:202641775624:web:fe2d70e4ec92d62d5b85bd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const studentsApp = initializeApp(studentFirebaseConfig, "students-shared");
const dbStudents = getFirestore(studentsApp);
const container = document.getElementById("container");
const pageMiddle = 2;

async function getCurrentStudentGroup() {
  const userId = localStorage.getItem("userId") || localStorage.getItem("savedCode");
  if (!userId) return "";
  try {
    const studentSnap = await getDoc(doc(dbStudents, "students", userId));
    if (!studentSnap.exists()) return "";
    return (studentSnap.data().group || "").toString();
  } catch (error) {
    console.error("Error loading student group:", error);
    return "";
  }
}

// دالة تحويل أي رابط Google Drive عادي لرابط تحميل مباشر تلقائياً
function formatDriveUrl(url) {
  const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (match && match[1]) {
    return `https://drive.google.com/uc?export=download&id=${match[1]}`;
  }
  return url;
}

async function loadButtons(){
    container.innerHTML = "";
    const studentGroup = await getCurrentStudentGroup();
    const groupSnap = await getDocs(collection(dbStudents, "groups"));
    const activeGroupIds = new Set();
    groupSnap.forEach((groupDoc) => {
      const data = groupDoc.data();
      if (data.active !== false) activeGroupIds.add(groupDoc.id);
    });
    const docSnap = await getDocs(collection(db, "documents"));
    const items = [];

    docSnap.forEach(item => {
      const data = item.data();
      if (!data.name || !data.link) return;

      const sameMiddle = String(data.middle ?? pageMiddle) === String(pageMiddle);
      const itemGroup = (data.group || "").toString();
      const groupMatches = Boolean(studentGroup) && itemGroup && itemGroup === studentGroup && activeGroupIds.has(itemGroup);
      const noGroupFallback = (!itemGroup || itemGroup === "") && (!studentGroup || activeGroupIds.has(studentGroup) || !studentGroup);

      if (groupMatches || (!studentGroup && noGroupFallback && sameMiddle) || (studentGroup && noGroupFallback && sameMiddle)) {
        items.push({ ...data, createdAt: data.createdAt || 0 });
      }
    });

    if (!items.length) {
      container.innerHTML = '<div class="doc-card"><h2>No documents available for your group yet.</h2></div>';
      return;
    }

    items.sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));

    items.forEach(data => {
        const directLink = formatDriveUrl(data.link);
        container.innerHTML += `
        <div class="doc-card">
            <h2>📄 ${data.name}</h2>
            <button class="btn" onclick="downloadFile('${directLink}')">
              DOWNLOAD DOCUMENT
            </button>
        </div>
        `;
    });
}

loadButtons();

const menuBtn = document.getElementById('menuBtn');
const sideMenu = document.getElementById('sideMenu');
const overlay = document.getElementById('menuOverlay');
const closeMenu = document.getElementById('closeMenu');

function openMenu() {
  sideMenu.classList.add('open');
  overlay.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeMenuPanel() {
  sideMenu.classList.remove('open');
  overlay.classList.remove('show');
  document.body.style.overflow = '';
}

menuBtn.addEventListener('click', openMenu);
closeMenu.addEventListener('click', closeMenuPanel);
overlay.addEventListener('click', closeMenuPanel);
document.addEventListener('keydown', function (event) {
  if (event.key === 'Escape') closeMenuPanel();
});

// دالة التحميل المباشر الممتازة لـ Google Drive
window.downloadFile = function(url) {
    const a = document.createElement("a");
    a.href = url;
    a.rel = "noopener noreferrer";
    document.body.appendChild(a);
    a.click();
    a.remove();
};
</script>
