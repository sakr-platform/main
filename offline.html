<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>offline</title>

    <link rel="stylesheet" href="style.css?v=2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Share+Tech&family=Orbitron:wght@500;700;800&display=swap"
        rel="stylesheet">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="logo.png" type="image/png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0');

        body::-webkit-scrollbar {
            display: none;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top, rgba(255, 255, 255, 0.22), transparent 12%),
                radial-gradient(circle at 20% 20%, rgba(255, 215, 0, 0.14), transparent 18%),
                radial-gradient(circle at 80% 0%, rgba(124, 58, 237, 0.25), transparent 20%),
                linear-gradient(145deg, #04043b 0%, #06066b 30%, #01011f 65%, #00000e 100%);
            color: #fff;
            font-family: "Share Tech", sans-serif;
            font-weight: 400;
            font-style: normal;
            margin: 0;
            padding-top: 82px;
        }

        .hero-wrap {
            width: min(100%, 560px);
            margin: 0 auto;
            padding: 18px 14px 44px;
            box-sizing: border-box;
            text-align: center;
        }

        .hero-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 30px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 18px 14px 22px;
        }

        .hero-visual {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.04));
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 24px;
            padding: 18px 16px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10);
        }

        .hero-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
        }

        .code-actions {
            align-items: stretch;
        }

        .upbox {
            background: linear-gradient(135deg, #ffe46b 0%, #ffd700 45%, #ffef99 100%);
            width: 100%;
            height: 74px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px 0 10px;
            box-sizing: border-box;
            color: rgb(0, 0, 103);
            font-size: 60px;
            font-family: "Share Tech", sans-serif;
            font-weight: 400;
            font-style: normal;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25), inset 0 -1px 0 rgba(255, 255, 255, 0.35);
            z-index: 999;
        }

        .brand-name {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 32px;
            line-height: 1;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .eyebrow {
            margin: 4px 0 8px;
            color: #ffe56b;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .hero-title {
            margin: 4px 0 6px;
            font-size: 30px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
        }

        .hero-text {
            margin: 0 auto 8px;
            max-width: 420px;
            color: rgba(255, 255, 255, 0.88);
            font-size: 16px;
            line-height: 1.4;
        }

        #logo {
            border-radius: 1000px;
        }

        .upboxs {
            position: static;
            display: flex;
            align-items: center;
            margin-left: auto;
        }

        .menu-btn {
            background: transparent;
            border: none;
            border-radius: 0;
            cursor: pointer;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .menu-btn:hover {
            transform: translateY(-1px);
        }

        .menu-btn img {
            width: 56px;
            height: auto;
            display: block;
        }

        @media (max-width: 850px) {
            .upbox {
                height: auto;
                min-height: 70px;
                padding: 6px 10px;
                gap: 8px;
            }

            .upbox img {
                width: 58px;
                height: auto;
            }

            .brand-name {
                font-size: 42px;
            }

            .menu-btn img {
                width: 44px;
                height: auto;
            }

            #mlogo {
                width: 280px;
            }

            .hh {
                position: fixed;
                left: 20px;
            }


        }

        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .menu-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .side-menu {
            position: fixed;
            top: 0;
            right: -340px;
            width: 300px;
            height: 100vh;
            background: linear-gradient(135deg, #ffd700, #ffea70);
            color: rgb(0, 0, 103);
            box-shadow: -8px 0 20px rgba(0, 0, 0, 0.25);
            padding: 20px;
            box-sizing: border-box;
            z-index: 1001;
            transition: right 0.3s ease;
            overflow-y: auto;
        }

        .side-menu.open {
            right: 0;
        }

        .close-menu {
            background: transparent;
            border: none;
            color: rgb(0, 0, 103);
            font-size: 36px;
            cursor: pointer;
            float: right;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .side-menu h2 {
            margin: 10px 0 30px;
            font-size: 28px;
        }

        .side-menu a {
            display: block;
            color: rgb(0, 0, 103);
            text-decoration: none;
            font-size: 22px;
            margin: 14px 0;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0, 0, 103, 0.22);
            transition: padding-left 0.2s ease;
        }

        .side-menu a:hover {
            padding-left: 8px;
        }

        .side-menu a .menu-icon {
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
            font-size: 20px;
            line-height: 1;
        }

        .material-symbols-rounded {
            font-family: 'Material Symbols Rounded';
            font-weight: 400;
            font-style: normal;
            line-height: 1;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 18px;
            width: 100%;
        }

        .btn {
            background: linear-gradient(135deg, #fff7c5 0%, #ffd700 45%, #ffbb00 100%);
            color: rgb(0, 0, 103);
            width: 100%;
            max-width: 420px;
            min-height: 72px;
            border: 3px solid rgba(255, 255, 255, 0.45);
            border-radius: 18px;
            font-size: 24px;
            font-family: "Share Tech", sans-serif;
            font-weight: 400;
            font-style: normal;
            margin: 0 auto;
            margin-top: 5px;
            cursor: pointer;
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease, color 0.25s ease;
        }

        .btn:hover {
            background: linear-gradient(135deg, #0b0b7a, #1010a0);
            color: rgb(255, 240, 180);
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.45);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        #mlogo {
            width: min(82vw, 350px);
            height: auto;
            display: block;
            margin: 0 auto 6px;
            filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.22));
        }

        .code-card {
            padding-bottom: 28px;
        }

        .code-label {
            display: block;
            text-align: left;
            color: rgba(255, 255, 255, 0.92);
            font-size: 15px;
            margin: 8px auto 6px;
            width: 100%;
            max-width: 420px;
        }

        .code-input {
            width: 100%;
            max-width: 420px;
            min-height: 52px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 0 14px;
            box-sizing: border-box;
            font: inherit;
            margin: 0 auto 10px;
        }

        .code-input::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        .code-note {
            color: rgba(255, 255, 255, 0.82);
            font-size: 13px;
            margin-top: 10px;
        }

        @media (min-width: 851px) {
            .hero-wrap {
                width: min(100%, 1100px);
            }

            .hero-card.hero-split {
                display: flex;
                align-items: stretch;
                gap: 24px;
                text-align: left;
                padding: 20px;
            }

            .hero-card.hero-split .hero-visual {
                flex: 1.05;
                min-width: 0;
            }

            .hero-card.hero-split .hero-actions {
                flex: 0.95;
                justify-content: center;
                padding: 10px 0;
            }

            .hero-card.hero-split .hero-actions .btn-group {
                margin-top: 0;
                max-width: 420px;
            }

            .hero-card.hero-split .hero-actions .btn {
                max-width: none;
            }

            .hero-card.hero-split .hero-visual .eyebrow,
            .hero-card.hero-split .hero-visual .hero-title,
            .hero-card.hero-split .hero-visual .hero-text {
                text-align: center;
            }

            .hero-card.hero-split .code-actions {
                justify-content: center;
            }
        }

        @media (max-width: 1024px) {
            .btn {
                min-height: 64px;
                font-size: 22px;
                border-radius: 16px;
            }

            .hero-card {
                padding: 18px 14px 24px;
            }
        }

        @media (max-width: 850px) {
            body {
                padding-top: 76px;
            }

            .upbox {
                height: auto;
                min-height: 70px;
                padding: 6px 10px;
                gap: 8px;
            }

            .upbox img {
                width: 56px;
                height: auto;
            }

            .brand-name {
                font-size: 24px;
            }

            .menu-btn img {
                width: 44px;
                height: auto;
            }

            #mlogo {
                width: 260px;
            }

            .btn {
                min-height: 60px;
                font-size: 20px;
                border-radius: 14px;
            }

            .hero-title {
                font-size: 26px;
            }

            .hero-text {
                font-size: 15px;
            }
        }

        .offline-card-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            z-index: 999;
            background: rgba(10, 11, 14, 0.6);
        }

        .offline-banner {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;

            background: rgba(18, 20, 26, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            color: white;

            padding: 40px 36px;
            border-radius: 20px;

            border: 1px solid rgba(234, 67, 53, 0.25);

            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.7),
                0 0 40px rgba(234, 67, 53, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);

            font-family: sans-serif;
            text-align: center;

            max-width: 400px;
            width: 100%;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* خط ضوئي أعلى المربع لإعطاء مظهر متقدم */
        .offline-banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ea4335, transparent);
        }

        .offline-banner .icon-wrapper {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(234, 67, 53, 0.18) 0%, rgba(234, 67, 53, 0.05) 70%);
            border: 1px solid rgba(234, 67, 53, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse-ring 2.5s infinite ease-in-out;
        }

        .offline-banner .icon {
            width: 42px;
            height: 42px;
            user-select: none;
            filter: brightness(0) saturate(100%) invert(48%) sepia(93%) saturate(2000%) hue-rotate(330deg);
        }

        .title {
            font-family: sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
            text-shadow: 0 0 10px rgba(234, 67, 53, 0.3);
        }

        .subtext {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.65);
            letter-spacing: 0.8px;
            line-height: 1.6;
            margin: 0;
        }

        /* زر Try Again */
        .btn-retry {
            margin-top: 8px;
            padding: 12px 32px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #ffffff;
            background: linear-gradient(135deg, rgba(234, 67, 53, 0.8), rgba(180, 30, 30, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 4px 15px rgba(234, 67, 53, 0.3);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-retry:hover {
            background: linear-gradient(135deg, rgba(255, 75, 60, 0.9), rgba(210, 40, 40, 1));
            box-shadow: 0 6px 20px rgba(234, 67, 53, 0.5);
            transform: translateY(-2px);
        }

        .btn-retry:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(234, 67, 53, 0.3);
        }

        @keyframes pulse-ring {
            0% {
                box-shadow: 0 0 0 0 rgba(234, 67, 53, 0.4);
                transform: scale(1);
            }

            50% {
                box-shadow: 0 0 0 16px rgba(234, 67, 53, 0);
                transform: scale(1.04);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(234, 67, 53, 0);
                transform: scale(1);
            }
        }
    </style>

    <script>
        (function () {
            const theme = localStorage.getItem('settings-theme') || 'dark';
            const accent = localStorage.getItem('settings-accent') || 'gold';

            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.setAttribute('data-accent', accent);
        })();
    </script>

</head>

<body>

    <div class="upbox">
        <div class="hh">
            <img src="logo.png" width="70px" alt="Logo">
        </div>
        &nbsp;&nbsp;&nbsp;&nbsp;<span class="brand-name">AMR SAKR</span>
    </div>

    <main>
        <section class="hero-actions">
            <div class="offline-card-wrapper">
                <div class="offline-banner">
                    <div class="icon-wrapper">
                        <img class="icon" src="wifi_off.svg" alt="No Internet">
                    </div>

                    <h2 class="title">You Are Offline</h2>

                    <p class="subtext">
                        Unable to connect to the network.<br>
                        Please check your connection and try again.
                    </p>

                    <button class="btn-retry" onclick="window.location.reload();">
                        Try Again
                    </button>
                </div>
            </div>
        </section>
    </main>

</body>

</html>
