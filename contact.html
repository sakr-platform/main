        <style>
            .support-section {
                text-align: center;
                width: 100%;
                max-width: 360px;
                margin: 0 auto;
                padding: 20px;
            }

            /* عنوان مريح وبسيط بدون أنيميشن مجهدة */
            .support-title {
                font-size: 22px;
                color: #ffffff;
                margin-bottom: 25px;
                text-transform: uppercase;
                letter-spacing: 2px;
                font-family: 'Share Tech', sans-serif;
                opacity: 0.9;
            }

            .btn-group-vertical {
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            /* تصميم الزر الشفاف الراقِي (Glassmorphism) */
            .cool-btn {
                position: relative;
                padding: 14px 28px;
                font-size: 16px;
                font-family: 'Share Tech', sans-serif;
                color: #ffffff;
                background: rgba(255, 255, 255, 0.05); /* خلفية شبه شفافة */
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.12); /* إطار ناعم */
                border-radius: 14px;
                cursor: pointer;
                text-decoration: none;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 12px;
                text-transform: uppercase;
                letter-spacing: 1.5px;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .cool-btn i {
                font-size: 20px;
                transition: transform 0.3s ease, color 0.3s ease;
            }

            /* إضاءة ولون خاص لكل أيقونة وإطار عند الـ Hover فقط */
            .btn-whatsapp i { color: #25D366; }
            .btn-facebook i { color: #1877F2; }
            .btn-telegram i { color: #229ED9; }

            /* تأثير الـ Hover الخفيف والمرتب */
            .btn-whatsapp:hover {
                background: rgba(37, 211, 102, 0.12);
                border-color: rgba(37, 211, 102, 0.4);
                box-shadow: 0 8px 20px rgba(37, 211, 102, 0.15);
                transform: translateY(-3px);
            }

            .btn-facebook:hover {
                background: rgba(24, 119, 242, 0.12);
                border-color: rgba(24, 119, 242, 0.4);
                box-shadow: 0 8px 20px rgba(24, 119, 242, 0.15);
                transform: translateY(-3px);
            }

            .btn-telegram:hover {
                background: rgba(34, 158, 217, 0.12);
                border-color: rgba(34, 158, 217, 0.4);
                box-shadow: 0 8px 20px rgba(34, 158, 217, 0.15);
                transform: translateY(-3px);
            }

            /* حركة بسيطة جدا للأيقونة عند الوقوف عليها */
            .cool-btn:hover i {
                transform: scale(1.15);
            }

            .cool-btn:active {
                transform: translateY(-1px);
            }
        </style>

    <script>
      (function() {

        const sidebarSide = localStorage.getItem('settings-sidebarSide') || 'right';
        const animations = localStorage.getItem('settings-animations') || 'normal';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-accent', accent);
        document.documentElement.setAttribute('data-font-size', fontSize);
        document.documentElement.setAttribute('data-sidebar-side', sidebarSide);
        document.documentElement.setAttribute('data-animations', animations);
      })();
    </script>

    <script>
      const menuBtn = document.getElementById('menuBtn');
      const sideMenu = document.getElementById('sideMenu');
      const overlay = document.getElementById('menuOverlay');
      const closeMenu = document.getElementById('closeMenu');

      function openMenu() {
        sideMenu.classList.add('open');
        overlay.classList.add('show');
        document.body.style.overflow = 'hidden';
      }

      function closeMenuPanel() {
        sideMenu.classList.remove('open');
        overlay.classList.remove('show');
        document.body.style.overflow = '';
      }

      menuBtn.addEventListener('click', openMenu);
      closeMenu.addEventListener('click', closeMenuPanel);
      overlay.addEventListener('click', closeMenuPanel);

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          closeMenuPanel();
        }
      });
    </script>
